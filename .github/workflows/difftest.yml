name: Difftest

# 和 RosettaStone 的差分測試。橋接程式沒變時用快取（全程約 2 分鐘）；改到 tools/rosetta-bridge/
# 才要從原始碼重編 RosettaStone（約 9 分鐘）。
# 觸發：改到差分測試相關檔案的 PR、手動、每晚一次。不是 main 的必要檢查。
on:
  pull_request:
    paths:
      - "tools/rosetta-bridge/**"
      - "tools/difftest/**"
      - "data/batches.tsv"
      - "data/keyword_pool.txt"
      - "data/stage2_pool.txt"
      - "data/stage3a_pool.txt"
      - "data/stage3b_pool.txt"
      - ".github/workflows/difftest.yml"
      # difftest 組牌時查 emberstone-data 的卡片資料，並和 emberstone-core、emberstone-cards（卡片效果）比對；
      # 相依套件與工具鏈版本也會影響結果
      - "crates/emberstone-data/**"
      - "crates/emberstone-core/**"
      - "crates/emberstone-cards/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      games:
        description: 隨機對局數
        default: "100"
  schedule:
    - cron: "0 18 * * *" # 台灣時間每天 02:00

concurrency:
  group: difftest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ROSETTA_SHA: 16902087454f8055c991474774922fd39f7d0875

jobs:
  difftest:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: 取得固定版本的 RosettaStone
        run: |
          mkdir -p "$RUNNER_TEMP/rosetta/RosettaStone"
          cd "$RUNNER_TEMP/rosetta/RosettaStone"
          git init -q
          git remote add origin https://github.com/utilForever/RosettaStone.git
          git fetch -q --depth 1 origin "$ROSETTA_SHA"
          git checkout -q FETCH_HEAD

      # 編好的橋接程式只取決於 RosettaStone 版本與 tools/rosetta-bridge/ 的內容；
      # 這些沒變（例如只改引擎、卡表、difftest）就直接重用，跳過約 9 分鐘的編譯。
      # 橋接程式內含 RosettaStone 卡表的絕對路徑，所以上面的原始碼仍要取回（只花幾秒）。
      - name: 快取編好的橋接程式
        id: bridge-cache
        uses: actions/cache@v4
        with:
          path: tools/rosetta-bridge/build/rosetta-bridge.exe
          key: bridge-${{ env.ROSETTA_SHA }}-${{ hashFiles('tools/rosetta-bridge/**') }}

      - name: 安裝 Ninja
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        run: |
          pip install ninja
          python -c "import ninja; print(ninja.BIN_DIR)" >> "$GITHUB_PATH"

      - name: 編譯橋接程式
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        shell: cmd
        env:
          ROSETTA_ROOT: ${{ runner.temp }}\rosetta
        run: |
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          call tools\rosetta-bridge\build.bat

      # 到這裡為止任一步失敗（取不到原始碼、編譯失敗）就停下，後面全部不跑（快取命中時編譯被略過不算失敗）。
      # 之後的測試與各卡池比對彼此獨立：只要準備完成，前一個失敗也照跑，一次看到全部結果；
      # 任何一步失敗整個工作流程仍算失敗。
      - name: 準備完成
        id: ready
        run: echo "橋接程式就緒"

      - name: 橋接程式測試
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo test -p emberstone-difftest --test bridge

      - name: 隨機對局差分（記錄與重播比對）
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          GAMES="${{ github.event.inputs.games || '100' }}"
          cargo run --release -p emberstone-difftest --bin difftest -- \
            run --batch A --games "$GAMES" --seed "${{ github.run_number }}" > difftest.txt || true
          {
            echo '## 差分測試（批次 A）'
            echo '```'
            grep -v '：一致$' difftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat difftest.txt
          # RosettaStone 本身的錯誤（逾時、當機）只回報；出現「不一致」才算失敗
          if grep -q '：不一致' difftest.txt; then exit 1; fi

      - name: 純關鍵字卡池差分（Emberstone 對 RosettaStone）
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          GAMES="${{ github.event.inputs.games || '100' }}"
          cargo run --release -p emberstone-difftest --bin difftest -- \
            run --engine emberstone --pool keywords --games "$GAMES" --seed "${{ github.run_number }}" > keywords.txt || true
          {
            echo '## 差分測試（Emberstone，純關鍵字卡池）'
            echo '```'
            grep -v '：一致$' keywords.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat keywords.txt
          if grep -q '：不一致' keywords.txt; then exit 1; fi

      # 第 2 階段（英雄技能、法術、戰吼、死亡之聲、秘密等）與第 3a 階段（批次 A）卡池，都帶英雄技能
      - name: 第 2 階段卡池差分（Emberstone 對 RosettaStone）
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          GAMES="${{ github.event.inputs.games || '100' }}"
          cargo run --release -p emberstone-difftest --bin difftest -- \
            run --engine emberstone --pool stage2 --powers --games "$GAMES" --seed "${{ github.run_number }}" > stage2.txt || true
          {
            echo '## 差分測試（Emberstone，第 2 階段卡池）'
            echo '```'
            grep -v '：一致$' stage2.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat stage2.txt
          if grep -q '：不一致' stage2.txt; then exit 1; fi

      - name: 第 3a 階段卡池差分（Emberstone 對 RosettaStone）
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          GAMES="${{ github.event.inputs.games || '100' }}"
          cargo run --release -p emberstone-difftest --bin difftest -- \
            run --engine emberstone --pool stage3a --powers --games "$GAMES" --seed "${{ github.run_number }}" > stage3a.txt || true
          {
            echo '## 差分測試（Emberstone，第 3a 階段卡池）'
            echo '```'
            grep -v '：一致$' stage3a.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat stage3a.txt
          if grep -q '：不一致' stage3a.txt; then exit 1; fi

      - name: 第 3b 階段卡池差分（Emberstone 對 RosettaStone）
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          GAMES="${{ github.event.inputs.games || '100' }}"
          cargo run --release -p emberstone-difftest --bin difftest -- \
            run --engine emberstone --pool stage3b --powers --games "$GAMES" --seed "${{ github.run_number }}" > stage3b.txt || true
          {
            echo '## 差分測試（Emberstone，第 3b 階段卡池）'
            echo '```'
            grep -v '：一致$' stage3b.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat stage3b.txt
          if grep -q '：不一致' stage3b.txt; then exit 1; fi
